<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打赏二维码</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: sans-serif;
      text-align: center;
      background: #f5f6f8;
      color: #222;
    }
    .codes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      margin: 28px auto;
    }
    .card {
      width: 340px;
      max-width: 100%;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }
    .card h2 { font-size: 20px; }
    .card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hint { color: #666; }
  </style>
</head>
<body>
  <h1>你来啦</h1>
  <p class="hint">一块不嫌少，十块不嫌多，感谢老板支持~</p>

  <main class="codes">
    <section class="card">
      <h2>打赏方式一</h2>
      <img src="./qr.png" alt="打赏方式一二维码">
    </section>

    <section class="card">
      <h2>打赏方式二</h2>
      <img src="./qr2.png" alt="打赏方式二二维码">
    </section>
  </main>
</body>
</html>
